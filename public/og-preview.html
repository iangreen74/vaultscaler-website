<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image Preview - Radix by VaultScaler</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .og-container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #000e4A 0%, #000F53 50%, #000F53 100%);
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Decorative blur circles */
    .circle-1 {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: #00e3ae;
      opacity: 0.1;
      filter: blur(60px);
      top: -200px;
      right: -100px;
    }

    .circle-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #00d9a6;
      opacity: 0.15;
      filter: blur(80px);
      bottom: -150px;
      left: -50px;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    .brand-name {
      font-size: 120px;
      font-weight: 700;
      color: #00e3ae;
      line-height: 1;
      margin-bottom: 40px;
    }

    .tagline {
      font-size: 52px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 28px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 80px;
    }

    .footer-text {
      font-size: 22px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Controls for tweaking */
    .controls {
      margin-top: 40px;
      background: #2a2a2a;
      padding: 30px;
      border-radius: 12px;
      color: #fff;
      width: 1200px;
    }

    .controls h2 {
      margin-bottom: 20px;
      font-size: 18px;
      color: #00e3ae;
    }

    .control-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-item label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }

    .control-item input {
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 14px;
    }

    .control-item input[type="color"] {
      height: 42px;
      cursor: pointer;
    }

    .control-item input[type="range"] {
      cursor: pointer;
    }

    .note {
      margin-top: 20px;
      padding: 15px;
      background: #333;
      border-radius: 8px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>OG Image Preview (1200 x 630)</h1>

  <div class="og-container" id="ogContainer">
    <div class="circle-1"></div>
    <div class="circle-2"></div>

    <div class="content">
      <div class="brand-name" id="brandName">Radix</div>
      <div class="tagline" id="tagline">Train Faster. Deploy Smarter.</div>
      <div class="subtitle" id="subtitle">AI Operations Platform</div>
      <div class="footer-text" id="footerText">by VaultScaler</div>
    </div>
  </div>

  <div class="controls">
    <h2>Tweak Settings</h2>

    <div class="control-group">
      <div class="control-item">
        <label>Brand Name</label>
        <input type="text" id="inputBrand" value="Radix" oninput="updateText('brandName', this.value)">
      </div>
      <div class="control-item">
        <label>Tagline</label>
        <input type="text" id="inputTagline" value="Train Faster. Deploy Smarter." oninput="updateText('tagline', this.value)">
      </div>
      <div class="control-item">
        <label>Subtitle</label>
        <input type="text" id="inputSubtitle" value="AI Operations Platform" oninput="updateText('subtitle', this.value)">
      </div>
    </div>

    <div class="control-group">
      <div class="control-item">
        <label>Brand Font Size</label>
        <input type="range" min="60" max="160" value="120" oninput="updateFontSize('brandName', this.value)">
      </div>
      <div class="control-item">
        <label>Tagline Font Size</label>
        <input type="range" min="30" max="80" value="52" oninput="updateFontSize('tagline', this.value)">
      </div>
      <div class="control-item">
        <label>Subtitle Font Size</label>
        <input type="range" min="16" max="48" value="28" oninput="updateFontSize('subtitle', this.value)">
      </div>
    </div>

    <div class="control-group">
      <div class="control-item">
        <label>Accent Color</label>
        <input type="color" value="#00e3ae" oninput="updateAccentColor(this.value)">
      </div>
      <div class="control-item">
        <label>Background Start</label>
        <input type="color" value="#000e4A" oninput="updateBgGradient()">
      </div>
      <div class="control-item">
        <label>Background End</label>
        <input type="color" value="#000F53" oninput="updateBgGradient()">
      </div>
    </div>

    <div class="note">
      <strong>Note:</strong> After tweaking, update the values in <code>public/og.svg</code> to match.
      This preview uses CSS which may render slightly differently than the SVG.
    </div>
  </div>

  <script>
    function updateText(elementId, value) {
      document.getElementById(elementId).textContent = value;
    }

    function updateFontSize(elementId, value) {
      document.getElementById(elementId).style.fontSize = value + 'px';
    }

    function updateAccentColor(color) {
      document.getElementById('brandName').style.color = color;
      document.querySelector('.circle-1').style.background = color;
      document.querySelector('.circle-2').style.background = color;
    }

    function updateBgGradient() {
      const start = document.querySelectorAll('.control-item input[type="color"]')[1].value;
      const end = document.querySelectorAll('.control-item input[type="color"]')[2].value;
      document.getElementById('ogContainer').style.background =
        `linear-gradient(135deg, ${start} 0%, ${end} 50%, ${end} 100%)`;
    }
  </script>
</body>
</html>
